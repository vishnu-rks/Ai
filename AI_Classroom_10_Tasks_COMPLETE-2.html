<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Classroom Lab</title><style>body{font-family:Arial;margin:0;background:#f4f6fb;color:#172033}.top{background:#312e81;color:white;padding:25px}nav{display:flex;gap:8px;overflow:auto;margin-top:20px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:bold}.tab{background:#ffffff22;color:white}.tab.active{background:white;color:#312e81}.wrap{max-width:1200px;margin:25px auto;padding:0 20px}.panel{display:none;background:white;padding:25px;border-radius:15px;box-shadow:0 5px 20px #0001}.panel.active{display:block}.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}.field textarea{min-height:110px}.btn{background:#5b5ce2;color:white;margin:5px}.out{margin-top:20px;padding:20px;border:1px dashed #bbb;border-radius:10px;min-height:180px}.card{padding:20px;background:#f8fafc;border-radius:12px;margin:10px 0}.resume h2{text-align:center}.resume h3{color:#4338ca;border-bottom:1px solid #ddd;padding-bottom:5px}.msg{padding:10px;margin:8px;border-radius:10px;background:#eef2ff}.user{background:#ddd6fe}.slide{display:none;background:#312e81;color:white;padding:40px;border-radius:15px;min-height:250px}.slide.active{display:block}.flash{min-height:250px;display:grid;place-items:center;background:#eef2ff;border-radius:15px;text-align:center;font-size:22px;font-weight:bold;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}}@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%}}</style></head><body><header class="top"><h1>🤖 AI Classroom Lab</h1><p>10 AI-powered student tasks in one webpage</p><nav id="tabs"></nav></header><main class="wrap" id="app"></main><script>
const T=[["resume","AI Resume Builder"],["notes","AI Notes Generator"],["ppt","AI Presentation Generator"],["mind","AI Mind Map Generator"],["sheets","Google Sheets Backend"],["quiz","AI Quiz / MCQ Generator"],["chat","AI Doubt-Solving Chatbot"],["flash","AI Flashcards"],["plan","AI Study Planner"],["ocr","AI Notes Summarizer (OCR)"]];
tabs.innerHTML=T.map((x,i)=>`<button class="tab ${i?'':'active'}" onclick="openTab('${x[0]}',this)">${i+1}. ${x[1]}</button>`).join("");
const forms={
resume:`<h2>AI Resume Builder</h2><p>Enter details and generate a professional resume.</p><div class="grid"><div><div class="field"><label>Name</label><input id="rn"></div><div class="field"><label>Contact</label><input id="rc"></div><div class="field"><label>Education</label><textarea id="re"></textarea></div><div class="field"><label>Skills</label><textarea id="rs"></textarea></div><div class="field"><label>Experience</label><textarea id="rx"></textarea></div><div class="field"><label>Objective</label><textarea id="ro"></textarea></div><button class="btn" onclick="resume()">✨ Generate Resume</button><button class="btn" onclick="window.print()">📄 PDF</button></div><div id="rout" class="out printable">Resume preview</div></div>`,
notes:`<h2>AI Notes Generator</h2><div class="field"><textarea id="ni" placeholder="Paste textbook paragraph/topic..."></textarea></div><button class="btn" onclick="notes()">✨ Generate Notes</button><div id="no" class="out"></div>`,
ppt:`<h2>AI Presentation Generator</h2><div class="field"><input id="pt" placeholder="Presentation topic"></div><button class="btn" onclick="ppt()">✨ Generate Slides</button><div id="po" class="out"></div><button class="btn" onclick="prev()">←</button><button class="btn" onclick="next()">→</button>`,
mind:`<h2>AI Mind Map Generator</h2><div class="field"><textarea id="mi" placeholder="Unit 1: Introduction&#10;Unit 2: Architecture&#10;Unit 3: Applications"></textarea></div><button class="btn" onclick="mind()">✨ Generate Mind Map</button><div id="mo" class="out"></div>`,
sheets:`<h2>Google Sheets as Backend</h2><p>Demo frontend table. Add your Apps Script Web App URL when connecting a real sheet.</p><div class="field"><input id="sn" placeholder="Student name"></div><div class="field"><input id="sm" placeholder="Marks"></div><button class="btn" onclick="addRow()">＋ Add Row</button><div id="so" class="out"></div>`,
quiz:`<h2>AI Quiz / MCQ Generator</h2><div class="field"><input id="qt" placeholder="Topic, e.g. DBMS"></div><button class="btn" onclick="quiz()">✨ Generate Quiz</button><div id="qo" class="out"></div>`,
chat:`<h2>AI Subject Doubt-Solving Chatbot</h2><div id="co" class="out"><div class="msg">👋 Ask your Computer Science doubt.</div></div><div class="field"><input id="ci" placeholder="Type your question..." onkeydown="if(event.key==='Enter')chat()"></div><button class="btn" onclick="chat()">Send</button> <button class="btn" onclick="co.innerHTML=''">Clear</button>`,
flash:`<h2>AI Flashcard Generator</h2><div class="field"><input id="ft" placeholder="Topic, e.g. Operating Systems"></div><button class="btn" onclick="flash()">✨ Generate Cards</button><div id="fo" class="flash">Click Generate</div><button class="btn" onclick="fnext()">Next →</button>`,
plan:`<h2>AI Study Planner</h2><div class="field"><textarea id="ps" placeholder="DBMS, OS, DAA, Java"></textarea></div><div class="field"><input id="ph" type="number" value="4" placeholder="Hours/day"></div><button class="btn" onclick="plan()">✨ Generate Timetable</button><div id="pl" class="out"></div>`,
ocr:`<h2>AI Notes Summarizer from Photos</h2><input type="file" accept="image/*" id="of" onchange="op()"><div class="field"><textarea id="ot" placeholder="Paste OCR text here if needed"></textarea></div><button class="btn" onclick="summ()">✨ Summarize</button><div id="oo" class="out"></div>`
};
app.innerHTML=T.map((x,i)=>`<section id="p-${x[0]}" class="panel ${i?'':'active'}">${forms[x[0]]}</section>`).join("");
function openTab(id,b){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.getElementById("p-"+id).classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function resume(){rout.innerHTML=`<div class="resume"><h2>${rn.value||"Your Name"}</h2><p style="text-align:center">${rc.value}</p><h3>CAREER OBJECTIVE</h3><p>${ro.value||"Motivated candidate seeking an opportunity to learn and contribute."}</p><h3>EDUCATION</h3><p>${re.value}</p><h3>SKILLS</h3><p>${rs.value}</p><h3>EXPERIENCE</h3><p>${rx.value||"Fresher with academic project experience."}</p></div>`}
function notes(){no.innerHTML="<h3>Study Notes</h3><ul><li>Main topic and key definition</li><li>Important concepts from the provided text</li><li>Examples and applications to remember</li></ul><b>Source:</b> "+(ni.value||"Enter text first")}
let si=0;function ppt(){let t=pt.value||"Artificial Intelligence";po.innerHTML=[1,2,3,4,5].map((n,i)=>`<div class="slide ${i?'':'active'}"><h1>${i==0?t:t+" — Key Concept "+i}</h1><ul><li>Important concept</li><li>Practical application</li><li>Example and key point</li></ul></div>`).join("");si=0}function showS(){document.querySelectorAll("#po .slide").forEach((x,i)=>x.classList.toggle("active",i==si))}function next(){if(po.children.length){si=(si+1)%po.children.length;showS()}}function prev(){if(po.children.length){si=(si-1+po.children.length)%po.children.length;showS()}}
function mind(){let a=mi.value.split("\n").filter(Boolean);mo.innerHTML="<div style='text-align:center'><b style='background:#312e81;color:white;padding:15px 25px;border-radius:30px'>SYLLABUS</b><div style='display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px'>"+a.map(x=>`<div class="card">${x}</div>`).join("")+"</div></div>"}
let rows=[["Aman",82],["Priya",91],["Rahul",76]];function renderRows(){so.innerHTML="<table style='width:100%'><tr><th>Name</th><th>Marks</th></tr>"+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")+"</table>"}function addRow(){rows.push([sn.value||"New Student",sm.value||0]);renderRows()}renderRows();
function quiz(){let t=qt.value||"Computer Science";qo.innerHTML=`<b>Quiz: ${t}</b><div class="card">Q1. What is an important way to learn ${t}?</div><button class="btn" onclick="this.style.background='#16a34a'">Practice concepts</button><button class="btn" onclick="this.style.background='#dc2626'">Do not study</button><div class="card">Q2. Which approach helps most?</div><button class="btn" onclick="this.style.background='#16a34a'">Understand + practice</button>`}
function chat(){let q=ci.value.trim();if(!q)return;co.innerHTML+=`<div class="msg user">${q}</div><div class="msg">🤖 Simple explanation: Break the concept into definition, working, example, and key points. Ask a follow-up question for more detail.</div>`;ci.value=""}
let fc=[],fi=0;function flash(){let t=ft.value||"DBMS";fc=[1,2,3,4,5].map(i=>({q:`${t}: What is key concept ${i}?`,a:`Review the definition, purpose, working and one practical example.`}));fi=0;showF()}function showF(){fo.innerHTML=`<div><b>${fc[fi].q}</b><hr><small>Tap Next to see another card. Current card ${fi+1}/${fc.length}</small></div>`}function fnext(){if(fc.length){fi=(fi+1)%fc.length;showF()}}
function plan(){let s=ps.value.split(",").map(x=>x.trim()).filter(Boolean);pl.innerHTML="<h3>Weekly Timetable</h3>"+["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map((d,i)=>`<div class="card"><b>${d}</b> — ${s[i%s.length]||"Study"} • ${ph.value||4} hours</div>`).join("")}
function op(){if(of.files[0])ot.value="Image selected. For OCR, use Tesseract.js or an OCR API to extract text here."}function summ(){oo.innerHTML="<h3>Summary</h3><ul><li>Key ideas extracted from the notes</li><li>Important definitions and concepts</li><li>Quick revision points</li></ul><p>"+(ot.value||"Upload an image or paste OCR text.")+"</p>"}
</script></body></html>
